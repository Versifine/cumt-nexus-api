name: Build and Deploy

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.2.0"
        required: true
        type: string
      deploy_to_server:
        description: "SSH to the configured server after pushing the image"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          image="ghcr.io/${repo}:${version}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - name: Verify package visibility is private
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          owner="${repo%%/*}"
          package="${repo#*/}"
          owner_type="$(gh api "/repos/${GITHUB_REPOSITORY}" --jq '.owner.type')"

          if [[ "${owner_type}" == "Organization" ]]; then
            endpoint="/orgs/${owner}/packages/container/${package}"
          else
            endpoint="/users/${owner}/packages/container/${package}"
          fi

          visibility=""
          for _ in {1..6}; do
            if visibility="$(gh api "${endpoint}" --jq '.visibility' 2>/dev/null)"; then
              break
            fi
            sleep 5
          done

          if [[ "${visibility}" != "private" ]]; then
            echo "::error::GHCR package ${owner}/${package} visibility is '${visibility:-unknown}', expected 'private'. Public GHCR packages cannot be changed back to private; create a new private package or fix package settings before releasing."
            exit 1
          fi

  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_to_server

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull image and restart API
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${GHCR_TOKEN}" | \
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' && \
             API_IMAGE='${{ needs.image.outputs.image }}' docker compose --env-file .env.production -f docker-compose.prod.yml pull && \
             API_IMAGE='${{ needs.image.outputs.image }}' docker compose --env-file .env.production -f docker-compose.prod.yml up -d && \
             API_IMAGE='${{ needs.image.outputs.image }}' docker compose --env-file .env.production -f docker-compose.prod.yml ps"
