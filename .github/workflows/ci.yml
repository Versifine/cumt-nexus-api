name: CI

on:
  push:
    branches:
      - main
      - "stage/**"
      - "fix/**"
      - "spike/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Test, baseline, and Docker build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cumt_nexus
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cumt_nexus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      APP_NAME: cumt-nexus-api
      APP_ENV: test
      APP_STARTUP_TIMEOUT: 10s
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: cumt_nexus
      POSTGRES_SSL_MODE: disable
      POSTGRES_MAX_CONNS: 25
      POSTGRES_MAX_CONN_LIFETIME: 5m
      POSTGRES_MAX_CONN_IDLE_TIME: 2m
      HTTP_ADDR: ":8080"
      HTTP_READ_TIMEOUT: 5s
      HTTP_WRITE_TIMEOUT: 10s
      HTTP_SHUTDOWN_TIMEOUT: 15s
      HTTP_CORS_ALLOWED_ORIGINS: http://localhost:5173
      LOG_LEVEL: info
      LOG_FORMAT: json
      AUTH_TOKEN_SECRET: ci-auth-secret
      AUTH_ACCESS_TOKEN_TTL: 24h
      OBJECT_STORAGE_PROVIDER: local
      OBJECT_STORAGE_ENDPOINT: ""
      OBJECT_STORAGE_REGION: auto
      OBJECT_STORAGE_BUCKET: ""
      OBJECT_STORAGE_ACCESS_KEY_ID: ""
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ""
      OBJECT_STORAGE_PUBLIC_BASE_URL: http://localhost:8080/uploads
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      OBJECT_STORAGE_LOCAL_ROOT: var/uploads
      UPLOAD_IMAGE_MAX_BYTES: 5242880
      UPLOAD_IMAGE_MAX_COUNT_PER_POST: 9
      UPLOAD_IMAGE_MAX_COUNT_PER_COMMENT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify current baseline
        shell: bash
        run: ./scripts/verify-current-baseline.sh --skip-http-smoke --r2-mode Skip

      - name: Build Docker image
        run: docker build -t cumt-nexus-api:ci .
