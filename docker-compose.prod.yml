name: cumt-nexus-api-prod

x-api-service: &api-service
  image: ${API_IMAGE:-cumt-nexus-api:local}
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    APP_NAME: ${APP_NAME}
    APP_ENV: ${APP_ENV}
    APP_STARTUP_TIMEOUT: ${APP_STARTUP_TIMEOUT}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DATABASE: ${POSTGRES_DATABASE}
    POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE}
    POSTGRES_MAX_CONNS: ${POSTGRES_MAX_CONNS}
    POSTGRES_MAX_CONN_LIFETIME: ${POSTGRES_MAX_CONN_LIFETIME}
    POSTGRES_MAX_CONN_IDLE_TIME: ${POSTGRES_MAX_CONN_IDLE_TIME}
    HTTP_ADDR: ${HTTP_ADDR:-:8080}
    HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT}
    HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT}
    HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT}
    HTTP_CORS_ALLOWED_ORIGINS: ${HTTP_CORS_ALLOWED_ORIGINS}
    LOG_LEVEL: ${LOG_LEVEL}
    LOG_FORMAT: ${LOG_FORMAT}
    GIN_MODE: ${GIN_MODE:-release}
    AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
    AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL}
    OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER}
    OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT}
    OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION}
    OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
    OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID}
    OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY}
    OBJECT_STORAGE_PUBLIC_BASE_URL: ${OBJECT_STORAGE_PUBLIC_BASE_URL}
    OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE}
    OBJECT_STORAGE_LOCAL_ROOT: ${OBJECT_STORAGE_LOCAL_ROOT:-/app/var/uploads}
    UPLOAD_IMAGE_MAX_BYTES: ${UPLOAD_IMAGE_MAX_BYTES}
    UPLOAD_IMAGE_MAX_COUNT_PER_POST: ${UPLOAD_IMAGE_MAX_COUNT_PER_POST}
    UPLOAD_IMAGE_MAX_COUNT_PER_COMMENT: ${UPLOAD_IMAGE_MAX_COUNT_PER_COMMENT}
  volumes:
    - uploads:/app/var/uploads
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *api-service
    restart: "no"
    entrypoint: ["/app/migrate"]
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-service
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  uploads:
